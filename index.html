<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Todo or not todo</title>
   </head>
   <style>
      * {
         font-family: Verdana, Geneva, Tahoma, sans-serif;
      }
      #app {
         display: flex;
         flex-direction: column;
      }
      body {
         margin: 0;
         height: 100vh;
         background: linear-gradient(90deg, #efe6da 0%, #e5d7ca 16.667%, #dac7b9 33.333%, #cfb6a9 50%, #c4a699 66.667%, #b9968b 83.333%, #af887e 100%);
      }
      .header {
         display: flex;
         flex-direction: column;
         align-items: center;
         margin-bottom: 30px;
      }
      input {
         width: 50%;
      }
      button {
      }
      input,
      button {
         border-radius: 5px;
         border: none;
         padding: 8px;
      }
      .edit {
         margin-right: 30px;
      }
      .delete {
         margin-left: 30px;
         color: white;
         background-color: #9d0000;
      }
      .edit,
      .delete {
         opacity: 0;
      }
      table:hover {
         background-color: rgba(0, 0, 0, 0.122);
         .edit,
         .delete {
            opacity: 1;
            cursor: pointer;
         }
      }
      td {
         padding: 8px;
         display: flex;
         justify-content: space-between;
      }
      .item {
         width: 100%;
      }

      .row {
         display: flex;
         flex-direction: row;
      }
      .gap {
         gap: 5px;
      }
      .between {
         justify-content: space-between;
      }
   </style>
   <body>
      <div id="app"></div>
   </body>
   <script>
      const app = document.getElementById("app");
      const svgEdit = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-pen"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>`;
      const svgDelete = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`;

      let item = ["item test 1", "item test 2", "item test 3"];
      let editIndex = null;

      let dateToday = new Date();
      let dateNorwegian = dateToday.toLocaleDateString("nb-NO", {
         day: "2-digit",
         month: "2-digit",
         year: "numeric",
      });

      let date = [dateToday, dateToday, dateToday];
      let dateToLocale = [];

      let dateIndex = null;

      let temporaryText = "";
      let temporaryDate = dateNorwegian;

      function updateView() {
         convertDate();
         app.innerHTML = buildView();
         document.getElementById("current-date").valueAsDate = new Date();
      }
      updateView();

      function convertDate() {
         dateToLocale = [];
         for (let i of date) {
            dateToLocale.push(
               i.toLocaleDateString("nb-NO", {
                  day: "2-digit",
                  month: "2-digit",
                  year: "numeric",
               }),
            );
         }
      }

      function buildView() {
         let view = `
         <div class="header">
            <h2>Todo or not todo</h2>
            <span class="row gap">
               <input placeholder="i need to..." onchange="temporaryText = this.value"></input>
               <input id="current-date" onchange="temporaryDate = this.value" type="date"></input>
               <button onclick="addItem(temporaryText, temporaryDate)">add</button>
            </span>
         </div>
         `;
         view += constructList();
         return view;
      }

      function constructList() {
         console.log(date);
         let view = "";
         for (let i = 0; i < item.length; i++) {
            let listItemComponent = `
               <span>${item[i]}</span>
               <span>${dateToLocale[i]}</span>
            `;
            if (editIndex === i) {
               listItemComponent = `
                  <input onchange="changeText(${i}, this.value)" value="${item[i]}"></input>
                  <input type="date" onchange="changeDate(${i}, this.value)" value="${date[i]}"></input>
               `;
            }
            view += `
               <table>
                  <td>
                     <button class="edit" onclick="editItem(${i})">${svgEdit}</button>
                     <span class="item row between gap">
                        ${listItemComponent}
                     </span> 
                     <button class="delete" onclick="deleteItem(${i})">${svgDelete}</button>
                  </td>
               </table>
         `;
         }
         return view;
      }

      function changeDate(index, value) {
         date[index] = value;
         dateIndex = null;
         updateView();
      }

      function changeText(index, value) {
         item[index] = value;
         editIndex = null;
         updateView();
      }

      function editItem(index) {
         if (editIndex === index) {
            editIndex = null;
            updateView();
         } else {
            editIndex = index;
            updateView();
         }
      }

      function addItem(textValue, dateValue) {
         console.log(textValue, dateValue, temporaryText, temporaryDate);
         item.push(textValue);
         date.push(dateValue);
         updateView();
      }

      function deleteItem(value) {
         item.splice(value, 1);
         updateView();
      }
   </script>
</html>
