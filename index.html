<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Todo or not todo</title>
   </head>
   <style>
      * {
         font-family:Verdana, Geneva, Tahoma, sans-serif;
      }
      #app {
         display: flex;
         flex-direction: column;
      }
      body {
         margin: 0;
         height: 100vh;
         background: linear-gradient(90deg, #efe6da 0%, #e5d7ca 16.667%, #dac7b9 33.333%, #cfb6a9 50%, #c4a699 66.667%, #b9968b 83.333%, #af887e 100%);
      }
      .header {
         display: flex;
         flex-direction: column;
         align-items: center;
      }
      input {
         width: 50%;
      }
      button {
      }
      input,
      button {
         border-radius: 5px;
         border: none;
         padding: 8px;
      }
      .edit {
      }
      .delete {
         color: white;
         background-color: #9d0000;
      }
      table {
         border-collapse: collapse;
      }
      td {
         /* border-bottom: 1px solid black; */
         padding: 8px;
         display: flex;
         justify-content: space-between;
         align-items: center;
      }
   </style>
   <body>
      <div id="app"></div>
   </body>
   <script>
      const app = document.getElementById("app");

      let list = ["item test 1", "item test 2", "item test 3"];
      let editIndex = null;

      function updateView() {
         app.innerHTML = buildView();
      }
      updateView();

      function buildView() {
         let view = `
         <div class="header">
            <h2>Todo or not todo</h2>
            <input onchange="addItem(this.value)"></input>
         </div>
         `;
         view += constructList();
         return view;
      }

      function constructList() {
         let view = "";
         for (let i = 0; i < list.length; i++) {
            let listItemComponent = `<span>${list[i]}</span>`;
            if (editIndex === i) {
               listItemComponent = `<input onchange="modifyItem(${i}, this.value)" value="${list[i]}"></input>`;
            }
            view += `
            <table>
               <td>
                  ${listItemComponent}
                  <span>
                     <button class="edit" onclick="editItem(${i})"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-pen"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg></button>
                     <button class="delete" onclick="deleteItem(${i})"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
                  </span>
               </td>
            </table>
         `;
         }
         return view;
      }
      function modifyItem(index, value) {
         list[index] = value;
         editIndex = null;
         updateView();
      }

      function editItem(index) {
         if (editIndex === index) {
            editIndex = null;
         } else {
            editIndex = index;
         }
         updateView();
      }

      function addItem(value) {
         list.push(value);
         updateView();
      }

      function deleteItem(value) {
         list.splice(value, 1);
         updateView();
      }
   </script>
</html>
